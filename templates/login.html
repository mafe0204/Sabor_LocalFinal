{% extends "base.html" %}
{% block title %}Ingresar — SaborLocal{% endblock %}
{% block content %}
<div id="app" data-page="login" class="card" style="max-width:400px;margin:40px auto;">
  <h2>Iniciar sesión</h2>
  <form id="form-login" method="post">
    <label>Correo electrónico</label>
    <input type="email" name="correo" required>
    <label>Contraseña</label>
    <input type="password" name="contrasena" required>
    <button type="submit">Ingresar</button>
  </form>
  <div class="top-links">
    <p class="muted">¿No tienes cuenta?</p>
    <a href="{{ url_for('registro_cliente') }}">Registrarme como cliente</a> ·
    <a href="{{ url_for('registro_chef') }}">Registrar mi restaurante</a>
  </div>
</div>
{% endblock %}
